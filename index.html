    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

      color: var(--paper);

      overflow: hidden;

      font-size: clamp(.7rem, 1.6vw, .82rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .34em;
      color: var(--orange);
      opacity: .95;

    h1 {
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: -.005em;
      font-size: clamp(2rem, 7.5vw, 4.2rem);
    }

    .mail {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      font-weight: 500;
      border-bottom: 2px solid var(--orange);
      padding-bottom: .1em;
      transition: color .25s ease;
    }
    .mail:hover { color: var(--orange-soft); }

    .insta {
      display: inline-flex;
      align-items: center;
      gap: .6em;
      font-size: clamp(.92rem, 2.2vw, 1.05rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--orange);
      transition: color .25s ease;
    }
    .insta:hover { color: var(--orange-soft); }
    .insta svg { width: 1.5em; height: 1.5em; flex: none; }
    @media (max-width: 600px) {
      .insta {
        flex-direction: column;
        gap: .8em;
        max-width: 26ch;
      }
      .insta svg { width: 2em; height: 2em; }
